# schema.yaml
# Documents the required keys for any product config file under config/.
# utils/config_loader.py validates required values before the pipeline loads.

product_id: string              # unique product identifier, e.g. "prismatic_cell"
strict_models: bool             # must be true; missing inference artifacts fail at startup

stations: int                   # number of physical camera stations
cameras_per_station: int        # cameras per station
reorientation_steps: list[str]  # ordered ops between stations, e.g. ["flip_180", "rotate_90"]
                                 # empty list [] means single-station, no reorientation

roi: [int, int, int, int] | null  # [x1, y1, x2, y2] fixed crop region, or null for full frame

preprocessing:
  resize: [int, int]            # target [width, height]
  blur_kernel: [int, int]       # odd, odd — GaussianBlur kernel size
  clahe: bool                   # apply CLAHE lighting normalization
  clahe_clip_limit: float
  clahe_tile_grid_size: [int, int]

models:
  yolo_seg: string              # path to YOLO segmentation weights
  cnn_classifier: string        # path to ResNet18 ONNX model
  anomaly: string               # path to trusted pickle feature memory bank

defect_classes:
  <int>: string                 # class_id -> class name, e.g. 0: scratch

decision_rules:
  fail_confidence_threshold: float   # min confidence to count a detection
  severity_map:
    <class_name>: "WARN" | "FAIL"    # per-class severity used by overlay + decision engine

detection:
  confidence_threshold: float

classification:
  input_size: int
  mean: [float, float, float]
  std: [float, float, float]
  onnx_opset: int                  # used by the classifier export script

anomaly_detection:
  threshold: float                 # normalized anomaly score threshold, [0, 1]
  distance_scale: float            # positive normalization factor for L2 distances
  hog:
    win_size: [int, int]           # full-image window size for each patch embedding
    patch_stride: [int, int]       # stride between sampled image patches
    block_size: [int, int]
    block_stride: [int, int]
    cell_size: [int, int]
    bins: int

runtime:
  data_dir: string                 # runtime images and CSV output directory

training:
  yolo_base_model: string          # locally provisioned pretrained YOLO segmentation weights
  yolo_dataset_config: string      # Ultralytics dataset YAML
  yolo_run_dir: string             # training run output directory
  classifier_dataset_dir: string   # class-named crop folders for ResNet18 training
  normal_image_dir: string         # defect-free frames for anomaly-bank creation
  yolo_epochs: int
  yolo_image_size: int
  yolo_batch_size: int
  yolo_workers: int
  yolo_device: string              # e.g. "cpu", "0", or "0,1"
