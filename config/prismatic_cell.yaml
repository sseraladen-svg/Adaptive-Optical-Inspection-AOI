product_id: prismatic_cell
strict_models: true

stations: 2
cameras_per_station: 3
reorientation_steps: ["flip_180", "rotate_90"]

roi: null

preprocessing:
  resize: [640, 640]
  blur_kernel: [3, 3]
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]

models:
  yolo_seg: models/prismatic_cell/yolo_seg.pt
  cnn_classifier: models/prismatic_cell/cnn_classifier.onnx
  anomaly: models/prismatic_cell/patchcore_memory_bank.pkl

detection:
  confidence_threshold: 0.5

classification:
  input_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  onnx_opset: 17

anomaly_detection:
  threshold: 0.5
  distance_scale: 1.0
  hog:
    win_size: [128, 128]
    patch_stride: [64, 64]
    block_size: [16, 16]
    block_stride: [8, 8]
    cell_size: [8, 8]
    bins: 9

runtime:
  data_dir: data

training:
  yolo_base_model: models/yolo11n-seg.pt
  yolo_dataset_config: dataset/synthetic_generated/yolo_seg/data.yaml
  yolo_run_dir: runs/train
  classifier_dataset_dir: dataset/synthetic_generated/cnn_classifier/train
  yolo_epochs: 100
  yolo_image_size: 640
  yolo_batch_size: 8
  yolo_workers: 4
  yolo_device: cpu

defect_classes:
  0: scratch
  1: dust
  2: stain
  3: unclassified

decision_rules:
  fail_confidence_threshold: 0.5
  severity_map:
    scratch: WARN
    dust: WARN
    stain: FAIL
    unclassified: FAIL
